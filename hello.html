
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Utility Tool</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>

<body>
  <div class="main-container">
    <header class="app-header">
      <div class="app-header__logo">U</div>
      <div>
        <div class="app-header__title">Utility Tool</div>
        <div class="app-header__subtitle">Ad image generator</div>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">☀</button>
    </header>

    <div class="container">
      <div class="section">
        <div class="i-o-container">
          <div class="input-container">
            <div class="screenshots-container">
              <button class="screenshot-btn-desktop">Desktop Screenshot</button>
              <button class="screenshot-btn-iphonex">Iphone X Screenshot</button>
              <button class="screenshot-btn-iphone6plus">Iphone 6 plus Screenshot</button>
              <button class="screenshot-btn-iphone14">Iphone 14 Pro Max Screenshot</button>
              <button class="screenshot-btn-galaxys10">Galaxy S10 Screenshot</button>
              <button class="screenshot-btn-ipad">Ipad Screenshot</button>
            </div>
            <p class="field-label" id="input-p">Source URL</p>
            <textarea id="input-text" rows="4" placeholder="Paste an image URL here..."></textarea>
          </div>
          <div class="output-container">
            <p class="field-label" id="output-p">Generated HTML</p>
            <textarea id="output-text" rows="4" placeholder="Your &lt;img&gt; HTML will appear here..."></textarea>
          </div>
        </div>
      </div>

      <div class="section">
        <p class="section__title">Actions</p>
        <div class="btns-container">
          <button id="copy-btn" class="copy-btn">COPY</button>
          <button id="border-red-btn" class="border-red-btn">BORDER RED</button>
          <button id="no-width" class="no-width-btn">ORIGINAL SIZE</button>
          <button id="border-red-no-width" class="border-red-btn">BORDER RED NO WIDTH</button>
        </div>
      </div>

      <div class="section">
        <p class="section__title">Ad Sizes</p>
        <div class="sizes-container">
            <button id="300x250-size-btn">300x250</button>
        </div>
      </div>

      <button class="automate-btn">Automate</button>

    </div>

  <script src="play.js" type="module"></script>
 </div>
  <!-- Script should be at the bottom -->
  <script src="popup.js" type="module"></script>
  <script src="sizes.js" type="module"></script>
</body>
</html>
